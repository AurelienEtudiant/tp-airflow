# OpenSearch : optionnel (lourd / fragile sous Docker Desktop). Demarrage sans : docker compose up -d
# Avec OpenSearch + Dashboards : docker compose --profile search up -d
#
# LocalExecutor : les taches tournent dans le scheduler (pas de Redis/Celery worker).
# Evite les DAGs bloques en "queued" et l'UI "Network Error" quand le worker est unhealthy.
name: projet-airflow

x-airflow-common: &airflow-common
  image: apache/airflow:3.2.0rc2-python3.14
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Lab : DAGs actifs a la creation (sinon : .\scripts\unpause-newsradar-chain.ps1)
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AIRFLOW_CONN_MINIO_DEFAULT: s3://minio_admin:minio_password_2026@?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1
    # IMPORTANT AIRFLOW 3
    AIRFLOW__API__SECRET_KEY: formation-airflow-api-secret-key-2026
    AIRFLOW__API_AUTH__JWT_SECRET: formation-airflow-jwt-secret-key-2026
    AIRFLOW__EXECUTION_API__JWT_AUDIENCE: urn:airflow.apache.org:task

    # Optionnel mais utile pour éviter des soucis de skew temporel
    AIRFLOW__API_AUTH__JWT_LEEWAY: "30"

    # Ancienne clé webserver, peu utile ici mais tu peux la garder
    AIRFLOW__WEBSERVER__SECRET_KEY: formation-airflow-web-secret-key-2026

    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "20"
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "40"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "true"
    # Connections préconfigurées
    AIRFLOW_CONN_POSTGRES_DWH: postgresql://dwh_user:dwh_password@postgres-dwh:5432/dwh
    AIRFLOW_CONN_POSTGRES_SOURCE: postgresql://source_user:source_password@postgres-source:5432/source_db
    # MinIO partagé avec tp-airflow-ingest (compose.parallel-projet.yaml → 39000:9000).
    # Les DAGs qui lisent data-lake (ex. newsradar_enrich_ml via minio_local) voient les articles_*.json du rss_consumer.
    AIRFLOW_CONN_MINIO_LOCAL: aws://minio_admin:minio_password_2026@?endpoint_url=http%3A%2F%2Fhost.docker.internal%3A39000&region_name=us-east-1
    AIRFLOW_CONN_API_ECOMMERCE: http://api-simulee:5000@?headers=%7B%22Authorization%22%3A+%22Bearer+formation-token-2026%22%7D

    AIRFLOW_VAR_API_TOKEN: formation-token-2026
    AIRFLOW_VAR_API_BASE_URL: http://api-simulee:5000

    # NewsRadar NLP : enrich_ml lit les JSON MinIO (prefixe articles_*, bucket data-lake) ou mode demo
    AIRFLOW_VAR_NLP_SERVICE_URL: http://nlp-service:8000
    AIRFLOW_VAR_NEWSRADAR_MINIO_BUCKET: data-lake
    AIRFLOW_VAR_NEWSRADAR_MINIO_PREFIX: articles_
    # Fichiers JSON listes dans MinIO (ordre trie par cle ; les 3 premiers seulement ici)
    AIRFLOW_VAR_NEWSRADAR_MINIO_MAX_FILES: "3"
    # Plafond d'articles apres chargement (chaque JSON peut contenir plusieurs articles)
    AIRFLOW_VAR_NEWSRADAR_MAX_ARTICLES: "3"

    _PIP_ADDITIONAL_REQUIREMENTS: >-
      apache-airflow-providers-fab==3.6.0
      apache-airflow-providers-postgres
      apache-airflow-providers-amazon
      apache-airflow-providers-http
      boto3
      requests
      faker
      minio

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
    - ./scripts:/opt/airflow/scripts:ro

  depends_on:
    postgres-airflow:
      condition: service_healthy

  networks:
    - airflow-net

services:
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  postgres-dwh:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_password
      POSTGRES_DB: dwh
    ports:
      - "5433:5432"
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data
      - ./init-db/init-dwh.sql:/docker-entrypoint-initdb.d/01-init-dwh.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh_user -d dwh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  postgres-source:
    image: postgres:16
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
      POSTGRES_DB: source_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./init-db/init-source.sql:/docker-entrypoint-initdb.d/01-init-source.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d source_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Image serveur : pas d'alias mc "local" garanti ; endpoint HTTP officiel
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - airflow-net

  api-simulee:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      API_TOKEN: formation-token-2026
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{dags,logs,plugins,tests}
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname Formation \
          --role Admin \
          --email admin@formation.local || true
    depends_on:
      postgres-airflow:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: nlp-service
    ports:
      - "8000:8000"
    environment:
      - MODEL_SENTIMENT=distilbert-base-uncased-finetuned-sst-2-english
      - MODEL_CLASSIFY=facebook/bart-large-mnli
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - airflow-net

  opensearch:
    profiles:
      - search
    image: opensearchproject/opensearch:3.6.0
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - cluster.name=newsradar-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      # Docker Desktop (Windows/macOS) : memory_lock=true fait souvent échouer le démarrage
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx1g"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s
    networks:
      - airflow-net

  opensearch-dashboards:
    profiles:
      - search
    image: opensearchproject/opensearch-dashboards:3.6.0
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    volumes:
      - os-dashboards-data:/usr/share/opensearch-dashboards/data
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - airflow-net

  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh
    command: /seed/seed.sh
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    volumes:
      - ./init-minio/seed.sh:/seed/seed.sh
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - airflow-net

volumes:
  postgres-airflow-data:
  postgres-dwh-data:
  postgres-source-data:
  minio-data:
  hf-cache:
  os-data:
  os-dashboards-data:

networks:
  airflow-net:
    driver: bridge
